<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="paralax-styles.css">
</head>
<body>

<div class="header">
    <img src="./images/EAN MCCULLAGH.png" alt="Logo" class="logo">
</div>

<div class="content">
    <div class="section">
        <h1>Welcome to my Website</h1>
        <p>This is the landing page.</p>
    </div>

    <div class="section">
        <h2>Sign Up</h2>
        <div class="signup-form">
            <form id="signup-form" action="/submit_signup" method="post">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="submit" value="Sign Up">
            </form>
            <div id="success-message" style="display:none; color: green;">Sign up successful!</div>
        </div>
    </div>
</div>

<script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent the form from submitting
        document.getElementById('success-message').style.display = 'block';
        setTimeout(function() {
            window.location.href = 'Intro.html';
        }, 1000); // Redirect after 2 seconds
    });
</script>

</body>
</html>
