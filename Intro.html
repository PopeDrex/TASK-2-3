<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallax Landing Page Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:400,600&display=swap');

        body, html {
            margin: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        .parallax {
            background-image: url('./images/index.jpg');
            height: 100vh;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        .parallax::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background-color: rgba(0, 0, 0, 0.5); */
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure content takes at least full viewport height */
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px; /* Add padding */
            box-sizing: border-box;
        }

        form {
            background: #fff;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 32px;
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 5px 0 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fdfdfd;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        .checkbox-group {
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            form {
                padding: 30px 20px;
            }
            h2 {
                font-size: 28px;
            }
            input[type="submit"] {
                width: 100%;
            }
        }

        .scroll-down {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: white;
            text-decoration: none;
        }

        .scroll-down:hover {
            text-decoration: underline;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }
    </style>
</head>
<body>
    <div class="parallax">
        <a href="#form" class="scroll-down">▼</a>
    </div>

    <div class="content" id="form">
        <form action="#" method="post">
            <h2>Student Information Form</h2>
            <p>Please fill out the form below:</p>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="0" max="120">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required placeholder="Enter your address">

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="education">Education Level:</label>
            <select id="education" name="education" required>
                <option value="">Select your education level</option>
                <option value="highschool">High School</option>
                <option value="bachelors">Bachelor's Degree</option>
                <option value="masters">Master's Degree</option>
                <option value="doctorate">Doctorate</option>
            </select>

            <label for="interests">Areas of Interest:</label>
            <div class="checkbox-group">
                <label for="interest1">
                    <input type="checkbox" id="interest1" name="interests" value="programming">
                    Programming
                </label>
                <label for="interest2">
                    <input type="checkbox" id="interest2" name="interests" value="design">
                    Design
                </label>
                <label for="interest3">
                    <input type="checkbox" id="interest3" name="interests" value="marketing">
                    Marketing
                </label>
            </div>

            <label for="comments">Additional Comments:</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Enter any additional comments here"></textarea>

            <input type="submit" value="Submit">
        </form>
    </div>

</body>
</html>
