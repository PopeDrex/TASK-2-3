<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallax Landing Page Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:400,600&display=swap');

        body, html {
            margin: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }
        .parallax {
            background-image: url('./images/index.jpg');
            height: 100vh;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }
        .parallax::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background-color: rgba(0, 0, 0, 0.5); */
        }
        .content {
            text-align: center;
            padding: 80px 20px;
            background-color: #f9f9f9;
        }
        form {
            background: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 32px;
            color: #333;
        }
        label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 5px 0 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fdfdfd;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .checkbox-group {
            text-align: left;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            margin-top: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        input[type="submit"]:active {
            transform: translateY(0);
        }
        /* Responsive Design */
        @media (max-width: 600px) {
            form {
                padding: 30px 20px;
            }
            h2 {
                font-size: 28px;
            }
            input[type="submit"] {
                width: 100%;
            }
        }
        .scroll-down {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: white;
            text-decoration: none;
            animation: bounce 2s infinite;
        }
        .scroll-down:hover {
            text-decoration: underline;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }
    </style>
</head>
<body>

    <div class="parallax">
        <a href="#form" class="scroll-down">▼</a>
    </div>

    <div class="content" id="form">
        <form action="#" method="post">
            <h2>Student Information Form</h2>
            <p>Please fill out the form below:</p>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="0" max="120">

            <label for="education">Education Level:</label>
            <select id="education" name="education" required>
                <option value="">Select your education level</option>
                <option value="highschool">High School</option>
                <option value="bachelors">Bachelor's Degree</option>
                <option value="masters">Master's Degree</option>
                <option value="doctorate">Doctorate</option>
            </select>
            <button onclick="location.href='test-lmao.html'" style="border: none; border-radius: 50px; cursor: pointer; font-size: 18px; padding: 10px 20px; background-color: #f44336; color: white;">
                Don't Touch
            </button>
        
            <label for="interests">Areas of Interest:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="interest1" name="interests" value="programming">
                <label for="interest1">Programming</label><br>
                <input type="checkbox" id="interest2" name="interests" value="design">
                <label for="interest2">Design</label><br>
                <input type="checkbox" id="interest3" name="interests" value="marketing">
                <label for="interest3">Marketing</label><br>
            </div>

            <label for="bio">Brief Bio:</label>
            <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself"></textarea>

            <input type="submit" value="Submit">
        </form>
    </div>

    <div class="parallax"></div>

</body>
</html>
